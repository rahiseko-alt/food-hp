version: 2
updates:
  # ロックファイルはルート1つ。pnpm workspace（apps/*, packages/*）と、ルート package.json で
  # 管理する静的サイト用の品質ツールの両方を "/" 指定でまとめてカバーする
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
