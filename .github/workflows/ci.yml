name: CI

# 機械の審判（machine judge）。AI の自己申告を証拠にしない。
# 完了報告の evidence はこのワークフローの run URL / commit SHA を指す。
#
# このリポジトリには2つの成果物が同居している：
#   - 静的サイト site/（ビルド無し。Cloudflare Pages がそのまま配信する本番の製品）
#   - Next.js モノレポ雛形 apps/ packages/（まだ製品ではない雛形）
# CI は両方を見るが、待ち時間の性質が違うので走らせ方を分けている。
#
# push は main だけをトリガーにする（feature branch への push は pull_request イベントで
# 既に CI が走るため、両方を対象にすると同一コミットに対して CI が2回丸ごと走り、
# 待ち時間が単純に倍になる）。
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect change scope
    runs-on: ubuntu-latest
    outputs:
      behavior: ${{ steps.filter.outputs.behavior }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        name: 挙動に関わるファイルが変わっているか確認
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # 差分の基準が取れない場合（新規ブランチ・force-push直後等）は安全側に倒して両方 true にする。
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "behavior=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD)

          # 静的サイトの JS・演出・e2e 関連
          if printf '%s\n' "$CHANGED" | grep -qE '^(site/assets/js/|site/assets/css/|site/index\.html$|tests/e2e/|playwright\.config\.mjs$|site/assets/vendor/)'; then
            echo "behavior=true" >> "$GITHUB_OUTPUT"
          else
            echo "behavior=false" >> "$GITHUB_OUTPUT"
          fi

          # Next.js 雛形（typecheck/build/起動スモークは分単位かかるので、触ったときだけ走らせる）
          if printf '%s\n' "$CHANGED" | grep -qE '^(apps/|packages/|presets/|pnpm-workspace\.yaml$|tsconfig\.base\.json$)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: references / lint / unit / audit / roadmap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check internal references
        run: pnpm run verify:references

      - name: Check Lottie contract
        run: pnpm run verify:lottie

      - name: Check asset version consistency
        run: pnpm run verify:asset-version

      - name: Check i18n parity
        run: pnpm run verify:i18n

      - name: Lint HTML, CSS, and JavaScript
        run: pnpm run lint

      - name: Run Node unit tests
        run: pnpm run test:unit

      - name: Audit dependencies
        run: pnpm run audit

      - name: Verify roadmap evidence
        run: pnpm run verify:roadmap

  browser:
    name: Playwright / axe
    needs: changes
    runs-on: ubuntu-latest
    # 文言・スタイルだけの変更では JS/演出は壊れようがないため、対象ファイルが変わったときだけ
    # 実際のテストを走らせる（e2e 約5分・a11y 約1.5分は CI の待ち時間の大半を占める）。
    #
    # ただし job-level の `if:` は使わない。auto-merge.yml が「conclusion が success/neutral 以外は
    # 未成功」と判定する設計（＝必須チェックを skip させて素通りさせる裏口を塞ぐため、skipped を
    # 緑扱いしない）なので、job ごと skip すると自動マージが永久に発火しなくなる。
    # 代わりに job は必ず走らせ、重い step だけを条件付きにして success で終わらせる。
    steps:
      - name: 対象外のときは理由を残して何もしない
        if: needs.changes.outputs.behavior != 'true'
        run: echo "JS・演出・e2e 関連の変更が無いため、ブラウザテストは実行しない（対象外）"

      - uses: actions/checkout@v4
        if: needs.changes.outputs.behavior == 'true'
        with:
          persist-credentials: false

      - name: Setup pnpm
        if: needs.changes.outputs.behavior == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node
        if: needs.changes.outputs.behavior == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        if: needs.changes.outputs.behavior == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        if: needs.changes.outputs.behavior == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        if: needs.changes.outputs.behavior == 'true'
        run: pnpm run test:e2e

      - name: Run accessibility tests
        if: needs.changes.outputs.behavior == 'true'
        run: pnpm run test:a11y

      - name: Upload browser artifacts
        if: failure() && needs.changes.outputs.behavior == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  web:
    name: typecheck / build / 起動スモーク (Next.js)
    needs: changes
    runs-on: ubuntu-latest
    # apps/ packages/ に触れたときだけ実際に検査する。静的サイトだけの変更では走らせない
    # （＝一文・一単語の変更を速く回すため）。
    # browser ジョブと同じ理由で job-level の `if:` は使わない（auto-merge が skipped を
    # 緑扱いしないため、job ごと skip すると自動マージが永久に発火しない）。
    steps:
      - name: 対象外のときは理由を残して何もしない
        if: needs.changes.outputs.web != 'true'
        run: echo "apps/ packages/ presets/ に変更が無いため、Next.js の検査は実行しない（対象外）"

      - uses: actions/checkout@v4
        if: needs.changes.outputs.web == 'true'
        with:
          persist-credentials: false

      - name: Setup pnpm
        if: needs.changes.outputs.web == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node
        if: needs.changes.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install (frozen lockfile)
        if: needs.changes.outputs.web == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: needs.changes.outputs.web == 'true'
        run: pnpm run web:typecheck

      - name: Lint
        if: needs.changes.outputs.web == 'true'
        run: pnpm run web:lint

      - name: Test
        if: needs.changes.outputs.web == 'true'
        run: pnpm run web:test

      - name: Build
        if: needs.changes.outputs.web == 'true'
        run: pnpm run web:build

      # 到達性を外部事実(HTTP 200＋本文マーカー)で縛る。スクショにしない。
      - name: Smoke (next start → curl 200 + 'cc-v2 monorepo')
        if: needs.changes.outputs.web == 'true'
        run: |
          pnpm run web:start &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          # 起動待ち（最大60秒）
          ready=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000 || true)
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "FAIL: server did not return 200 within timeout (last code: ${code:-none})"
            exit 1
          fi

          # 本文に既知マーカーを含むこと
          body=$(curl -sf http://localhost:3000)
          if ! printf '%s' "$body" | grep -q 'cc-v2 monorepo'; then
            echo "FAIL: body did not contain marker 'cc-v2 monorepo'"
            exit 1
          fi

          echo "SMOKE OK: HTTP 200 かつ本文に 'cc-v2 monorepo' を確認"

  gate:
    name: ci-green
    # 集約ゲート＝branch protection が要求する「安定した1つの必須チェック」。
    # 内部 job の名前や中身が変わっても context 名は 'ci-green' で不変。
    #
    # 待つのは changes（変更範囲の判定）・quality（数秒〜数十秒の機械検証）・web の3つ。
    # web は job ごと skip せず必ず走り、対象外のときは重い step だけ飛ばして success で終わる
    # ＝静的サイトの一文修正で Next.js のビルドを待たされない。
    # changes を needs に入れるのは、判定そのものが落ちたときに web が skipped になり、
    # それを緑と読んで ci-green が通ってしまう抜け穴を塞ぐため。
    # browser(e2e/a11y) は参考扱いで、ここでは待たない。
    needs: [changes, quality, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 上流ジョブが全て success か検査（success 以外は全て赤）
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: |
          # skipped も緑扱いしない。3つとも job-level の if: を持たないので、
          # success 以外になるのは「本当に落ちた/中断された」ときだけ。
          for pair in "changes=$CHANGES_RESULT" "quality=$QUALITY_RESULT" "web=$WEB_RESULT"; do
            if [ "${pair#*=}" != "success" ]; then
              echo "ci-green: FAIL (${pair})"
              exit 1
            fi
          done
          echo "ci-green: OK (changes=$CHANGES_RESULT quality=$QUALITY_RESULT web=$WEB_RESULT)"
