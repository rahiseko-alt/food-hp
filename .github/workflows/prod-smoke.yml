name: prod-smoke

# 本番到達の外部事実チェック。
# 実行環境(サンドボックス)は外向きが遮断されるため、プロキシ外の実機である
# GitHub Actions に本番URLを curl させて機械判定する。
# この run が緑＝「公開URLが 200 かつ本文に 'Kose Food AI'」の evidence。
#
# 手動実行のみ（workflow_dispatch）にしてある理由：
# Cloudflare Pages への接続とカスタムドメイン設定は人の手作業なので、
# それが済むまで push のたびに赤くなる（＝オオカミ少年になる）ため。
# 公開が済んだら Actions タブから 1 回まわし、その run URL を
# docs/roadmap.html の evidence に貼る。常時監視に切り替えたくなったら
# 下の schedule/push トリガーを足す。
on:
  workflow_dispatch:

# 本番URL。ドメインが変わったらここを更新する。
env:
  PROD_URL: "https://food.kouheikosehira.com"

jobs:
  reachable:
    name: prod 200 + marker
    runs-on: ubuntu-latest
    steps:
      - name: curl production (200 かつ 'Kose Food AI') — G-2-2
        run: |
          echo "Checking ${PROD_URL}"
          code=$(curl -sS -L -o body.html -w '%{http_code}' --max-time 30 "${PROD_URL}")
          echo "HTTP=${code}"
          if [ "${code}" != "200" ]; then
            echo "FAIL: 期待 200 に対し ${code}"
            exit 1
          fi
          if ! grep -q 'Kose Food AI' body.html; then
            echo "FAIL: 本文にマーカー 'Kose Food AI' が無い"
            exit 1
          fi
          echo "PROD OK: 200 かつ 'Kose Food AI' を ${PROD_URL} で確認"

      - name: 公開アセットが 200 で配信されている — G-2-3
        run: |
          fail=0
          for p in assets/css/site.css assets/js/main.mjs assets/lottie/hero.json assets/lottie/hero-sp.json assets/art/paper.png assets/art/greeting-ink.png; do
            code=$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 30 "${PROD_URL}/${p}")
            echo "${code} ${p}"
            [ "${code}" = "200" ] || fail=1
          done
          test "${fail}" = "0"
          echo "ASSETS OK: 主要アセットが本番で 200"

      - name: アセットのバージョン付きURLが本番で 200 — G-6-2
        run: |
          # /assets/* は1年 immutable キャッシュ（site/_headers）。中身を差し替えても
          # クエリ(?v=)を上げていなければ既存訪問者には一生届かない。ここでは
          # 本番が実際に配っている index.html から現在の ?v= 付き参照を取り出し、
          # そのURLがちゃんと 200 を返すこと（＝新しいURLとして生きていること）を確かめる。
          curl -sS -L --max-time 30 "${PROD_URL}" -o body.html
          refs=$(grep -oE '(href|src)="assets/(css|js)/[^"]+"' body.html | sed -E 's/.*"(.*)"/\1/')
          # 参照が1件も取れないまま「全部200」と報告するのを防ぐ（空振り合格の封じ込め）。
          if [ -z "${refs}" ]; then
            echo "FAIL: 本番の index.html から assets/(css|js) の参照が1件も取れなかった"
            exit 1
          fi
          fail=0
          for p in ${refs}; do
            if [ "${p#*\?v=}" = "${p}" ]; then
              echo "FAIL: ${p} に ?v= が付いていません（キャッシュバスティング未適用）"
              fail=1
              continue
            fi
            code=$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 30 "${PROD_URL}/${p}")
            echo "${code} ${p}"
            [ "${code}" = "200" ] || fail=1
          done
          test "${fail}" = "0"
          echo "ASSET VERSION OK: 本番のバージョン付きURLがすべて 200"

      - name: 問い合わせ導線が公開されている
        run: |
          curl -sS -L --max-time 30 "${PROD_URL}" -o body.html
          grep -q 'id="contact"' body.html
          grep -q '<form' body.html
          echo "CONTACT OK: 問い合わせ欄とフォームを確認"

      - name: 既存サイト・メールが無傷であること — G-2-4
        run: |
          # apex / www は Vercel の既存サイト、MX は Google Workspace。
          # サブドメイン追加でこれらを壊していないことを DNS の実測で確かめる。
          # dig の引数は [name] [type] [class] の順。`dig name A CNAME` は CNAME が class として
          # 解釈されて必ず失敗するため、種別ごとに分けて引く。
          # 期待値は docs/site/DEPLOY.md の DNS 実測表が正。Vercel 側が IP を変えたら両方を更新する。
          VERCEL_IP="76.76.21.21"
          echo "--- apex / www ---"
          apex=$(dig +short kouheikosehira.com A | tr '\n' ' ')
          www_a=$(dig +short www.kouheikosehira.com A | tr '\n' ' ')
          www_cname=$(dig +short www.kouheikosehira.com CNAME | tr '\n' ' ')
          echo "apex=${apex}"
          echo "www(A)=${www_a}"
          echo "www(CNAME)=${www_cname}"
          # 「空でないこと」だけでは、別のIPに向いていても通ってしまう。期待値と突き合わせる。
          if ! printf '%s' "${apex}" | grep -qw "${VERCEL_IP}"; then
            echo "FAIL: apex の A が期待値 ${VERCEL_IP} ではない（既存サイトが差し替わっている疑い）"
            exit 1
          fi
          if [ -z "${www_a}${www_cname}" ]; then
            echo "FAIL: www の A も CNAME も引けない（既存サイトの www が消えている）"
            exit 1
          fi
          if [ -n "${www_a}" ] && ! printf '%s' "${www_a}" | grep -qw "${VERCEL_IP}"; then
            echo "FAIL: www の A が期待値 ${VERCEL_IP} ではない"
            exit 1
          fi

          echo "--- MX (Google Workspace) ---"
          # 部分一致（grep 'google.com'）だと evilgoogle.com のようなホストも通ってしまうため、
          # ホスト名を取り出して Google Workspace の正規ホストと完全一致で突き合わせる。
          mx_hosts=$(dig +short kouheikosehira.com MX | awk '{print tolower($2)}')
          echo "mx_hosts=${mx_hosts}"
          if [ -z "${mx_hosts}" ]; then
            echo "FAIL: MX レコードが1件も無い（メールが止まる）"
            exit 1
          fi
          ok=0
          for h in ${mx_hosts}; do
            case "${h}" in
              aspmx.l.google.com.|alt1.aspmx.l.google.com.|alt2.aspmx.l.google.com.|alt3.aspmx.l.google.com.|alt4.aspmx.l.google.com.)
                ok=1 ;;
              *)
                echo "WARN: 想定外の MX ホスト ${h}" ;;
            esac
          done
          if [ "${ok}" != "1" ]; then
            echo "FAIL: MX に Google Workspace の正規ホストが見当たらない（メールが止まる）"
            exit 1
          fi
          echo "DNS OK: 既存サイトの A と Google Workspace の MX は無傷"
