name: prod-smoke

# 本番到達の外部事実チェック。
# 実行環境(サンドボックス)は外向きが遮断されるため、プロキシ外の実機である
# GitHub Actions に本番URLを curl させて機械判定する。
# この run が緑＝「公開URLが 200 かつ本文に 'Kose Food AI'」の evidence。
#
# 手動実行のみ（workflow_dispatch）にしてある理由：
# Cloudflare Pages への接続とカスタムドメイン設定は人の手作業なので、
# それが済むまで push のたびに赤くなる（＝オオカミ少年になる）ため。
# 公開が済んだら Actions タブから 1 回まわし、その run URL を
# docs/roadmap.html の evidence に貼る。常時監視に切り替えたくなったら
# 下の schedule/push トリガーを足す。
on:
  workflow_dispatch:

# 本番URL。ドメインが変わったらここを更新する。
env:
  PROD_URL: "https://food.kouheikosehira.com"

jobs:
  reachable:
    name: prod 200 + marker
    runs-on: ubuntu-latest
    steps:
      - name: curl production (200 かつ 'Kose Food AI') — G-2-2
        run: |
          echo "Checking ${PROD_URL}"
          code=$(curl -sS -L -o body.html -w '%{http_code}' --max-time 30 "${PROD_URL}")
          echo "HTTP=${code}"
          if [ "${code}" != "200" ]; then
            echo "FAIL: 期待 200 に対し ${code}"
            exit 1
          fi
          if ! grep -q 'Kose Food AI' body.html; then
            echo "FAIL: 本文にマーカー 'Kose Food AI' が無い"
            exit 1
          fi
          echo "PROD OK: 200 かつ 'Kose Food AI' を ${PROD_URL} で確認"

      - name: 公開アセットが 200 で配信されている — G-2-3
        run: |
          fail=0
          for p in assets/css/site.css assets/js/main.mjs assets/lottie/hero.json assets/lottie/hero-sp.json assets/art/paper.png; do
            code=$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 30 "${PROD_URL}/${p}")
            echo "${code} ${p}"
            [ "${code}" = "200" ] || fail=1
          done
          test "${fail}" = "0"
          echo "ASSETS OK: 主要アセットが本番で 200"

      - name: アセットのバージョン付きURLが本番で 200 — G-6-2
        run: |
          # /assets/* は1年 immutable キャッシュ（site/_headers）。中身を差し替えても
          # クエリ(?v=)を上げていなければ既存訪問者には一生届かない。ここでは
          # 本番が実際に配っている index.html から現在の ?v= 付き参照を取り出し、
          # そのURLがちゃんと 200 を返すこと（＝新しいURLとして生きていること）を確かめる。
          curl -sS -L --max-time 30 "${PROD_URL}" -o body.html
          fail=0
          for p in $(grep -oE '(href|src)="assets/(css|js)/[^"]+"' body.html | sed -E 's/.*"(.*)"/\1/'); do
            if [ "${p#*\?v=}" = "${p}" ]; then
              echo "FAIL: ${p} に ?v= が付いていません（キャッシュバスティング未適用）"
              fail=1
              continue
            fi
            code=$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 30 "${PROD_URL}/${p}")
            echo "${code} ${p}"
            [ "${code}" = "200" ] || fail=1
          done
          test "${fail}" = "0"
          echo "ASSET VERSION OK: 本番のバージョン付きURLがすべて 200"

      - name: 問い合わせ導線が公開されている
        run: |
          curl -sS -L --max-time 30 "${PROD_URL}" -o body.html
          grep -q 'id="contact"' body.html
          grep -q '<form' body.html
          echo "CONTACT OK: 問い合わせ欄とフォームを確認"

      - name: 既存サイト・メールが無傷であること — G-2-4
        run: |
          # apex / www は Vercel の既存サイト、MX は Google Workspace。
          # サブドメイン追加でこれらを壊していないことを DNS の実測で確かめる。
          echo "--- apex / www ---"
          apex=$(dig +short kouheikosehira.com A | tr '\n' ' ')
          www=$(dig +short www.kouheikosehira.com A CNAME | tr '\n' ' ')
          echo "apex=${apex}"
          echo "www=${www}"
          if [ -z "${apex}" ]; then echo "FAIL: apex の A レコードが消えている"; exit 1; fi

          echo "--- MX (Google Workspace) ---"
          mx=$(dig +short kouheikosehira.com MX | tr '\n' ' ')
          echo "mx=${mx}"
          if ! printf '%s' "${mx}" | grep -q 'google.com'; then
            echo "FAIL: MX に Google Workspace が見当たらない（メールが止まる）"
            exit 1
          fi
          echo "DNS OK: 既存サイトの A と Google Workspace の MX は無傷"
